name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['14.6.0', '22', '24']
        include:
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node == '14.6.0' && '22' || matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn build
      - uses: actions/setup-node@v4
        if: matrix.node == '14.6.0'
        with:
          node-version: ${{ matrix.node }}
      - run: node test/regression.cjs
      - run: npm pack --dry-run --ignore-scripts
